<!doctype html>
<!--
  Japaccent. (ジャパクセント) — 日本語アクセント辞書
  Code: GPL-3.0-or-later (see LICENSE)   Accent data (dictionary.json): WTFPL (see LICENSE-DATA)

<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Japaccent. ジャパクセント</title>
<style>
:root{
  --bg:#14161a;--bg2:#1b1e24;--bg3:#242932;--fg:#d7dae0;--dim:#7d8590;
  --acc:#e5c07b;--grn:#98c379;--red:#e06c75;--blu:#61afef;--mag:#c678dd;--line:#2c313a;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Noto Sans Mono CJK JP",monospace;
  --sans:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);display:grid;grid-template-rows:auto auto 1fr auto;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{background:var(--bg3);border:1px solid var(--line);border-radius:4px;padding:3px 10px;cursor:pointer}
button:hover{border-color:var(--blu)}
button[hidden],[hidden]{display:none!important}
input[type=text],input:not([type]),textarea{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 8px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--blu)}
.mono{font-family:var(--mono)}
.dim{color:var(--dim)}

header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--line)}
header h1{font:700 16px var(--mono);margin:0;color:var(--grn)}
header h1 span{color:var(--dim)}
.sp{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg label{padding:3px 10px;cursor:pointer;background:var(--bg3)}
.seg input{display:none}
.seg label:has(input:checked){background:var(--blu);color:#111}
.chk{display:flex;gap:4px;align-items:center;cursor:pointer;color:var(--dim)}
#user{color:var(--acc);cursor:pointer;font-size:12px}
#reqCount{font-style:normal;background:var(--red);color:#111;border-radius:8px;padding:0 6px;margin-left:4px;font-size:12px}

main{display:grid;grid-template-columns:1fr 1fr;min-height:0}
section{display:flex;flex-direction:column;min-height:0;padding:12px 14px;gap:10px}
#tool{border-right:1px solid var(--line)}
h2.t{font:600 12px var(--mono);color:var(--dim);margin:0;letter-spacing:.04em}
#src{height:32%;min-height:90px;resize:vertical;font-size:16px;line-height:1.7}
#out{flex:1;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:14px 16px;font-size:22px;line-height:2.6;white-space:pre-wrap;word-break:break-all}
#out:empty::before{content:"ここに結果が出ます";color:var(--dim);font-size:14px}
.tok{cursor:pointer;display:inline-flex;flex-direction:column;align-items:center;vertical-align:top;line-height:inherit}
.tok.multi{border-bottom:1px dotted var(--mag)}
.tok .cap{font-size:10px;line-height:1;color:var(--dim);margin-top:-1.1em}

/* 旧方式: 上線 + カギ */
.old{display:inline-block;white-space:nowrap}
.old .m{display:inline-block;border-top:2px solid transparent;line-height:1.35;padding:0 1px}
.old .m.h{border-top-color:var(--acc)}
.old .m.d{border-right:2px solid var(--acc)}
/* 新方式: 下がり目記号 */
.dm{color:var(--red);font-weight:400}

#q{font-family:var(--mono)}
#list{flex:1;overflow:auto;border:1px solid var(--line);border-radius:6px;background:var(--bg2);min-height:120px}
.row{display:grid;grid-template-columns:minmax(80px,1fr) minmax(110px,1.4fr) 50px 56px;gap:8px;padding:5px 10px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer;font-size:16px;line-height:1.7}
.row.sel{background:#2a3140;box-shadow:inset 3px 0 var(--grn)}
.row .k{font:12px var(--mono);color:var(--dim)}
.badge{font:11px var(--mono);border-radius:3px;padding:0 5px;text-align:center;border:1px solid var(--line);color:var(--dim)}
.badge.cloud{color:var(--blu);border-color:var(--blu)}
.badge.local{color:var(--mag);border-color:var(--mag)}
#detail{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:13px;max-height:34%;overflow:auto}
#detail .big{font-size:20px;line-height:2}
#detail .kv{display:grid;grid-template-columns:90px 1fr;gap:2px 10px}
#detail .kv>span:nth-child(odd){color:var(--dim)}
.yr{font:12px var(--mono);color:var(--dim);margin-right:6px}

#status{display:flex;gap:16px;align-items:center;padding:3px 14px;background:var(--bg3);border-top:1px solid var(--line);font:12px var(--mono)}
#mode{background:var(--grn);color:#111;padding:1px 10px;font-weight:700}
#mode.INSERT{background:var(--blu)}#mode.SEARCH{background:var(--acc)}#mode.CONFIRM{background:var(--red)}#mode.PANEL{background:var(--mag)}

.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:10;padding:12px}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:16px 18px;width:min(640px,100%);max-height:94vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.box h2{margin:0;font-size:16px}
.box label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--dim)}
.box label .hint{color:var(--dim);font-size:11px}
.big{font-size:20px}
#f_input{font-family:var(--mono);font-size:22px;letter-spacing:.05em}
#f_prev{background:var(--bg);border:1px dashed var(--line);border-radius:6px;padding:8px 12px;font-size:20px;line-height:2.1;min-height:52px}
#f_prev .err{color:var(--red);font-size:13px}
#f_prev .meta{font:12px var(--mono);color:var(--dim);margin-left:10px}
.btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btns .pri{background:var(--grn);color:#111;border-color:var(--grn);font-weight:700}
.prow{padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.prow.sel{background:#2a3140;box-shadow:inset 3px 0 var(--mag)}
.st-pending{color:var(--acc)}.st-approved{color:var(--grn)}.st-rejected{color:var(--red)}
#plist{overflow:auto;max-height:60vh;border:1px solid var(--line);border-radius:6px}
kbd{font:12px var(--mono);background:var(--bg3);border:1px solid var(--line);border-radius:3px;padding:0 5px}
.help td{padding:2px 12px 2px 0;vertical-align:top}
#annBanner{display:flex;gap:10px;align-items:center;padding:4px 14px;background:#2a2433;border-bottom:1px solid var(--line);font-size:13px}
#annBanner span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
#annCount{font-style:normal;background:var(--acc);color:#111;border-radius:8px;padding:0 6px;margin-left:4px;font-size:12px}
#block{position:fixed;inset:0;z-index:100;background:#0b0c0f;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px}
.blockbox{max-width:420px;display:flex;flex-direction:column;gap:10px;align-items:center}
.blockbox img{width:min(260px,70vw);border-radius:16px}
.blocked header,.blocked main,.blocked #status,.blocked #annBanner{display:none!important}
#cmd{width:260px;padding:0 6px;border-radius:0;font:12px var(--mono)}
#mode.COMMAND{background:var(--mag)}
.pri{background:var(--grn);color:#111;border-color:var(--grn);font-weight:700}
#toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--blu);padding:6px 14px;border-radius:6px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

@media(max-width:820px){
  body{overflow:auto;display:block}
  main{grid-template-columns:1fr}
  #tool{border-right:0;border-bottom:1px solid var(--line)}
  #out{min-height:200px}
  #list{max-height:50vh}
  #status{position:sticky;bottom:0}
}
</style>
</head>
<body>

<header>
  <h1 id="logo" style="cursor:default;user-select:none">Japaccent<span>.</span></h1>
  <div class="seg" title="t キーで切替">
    <label><input type="radio" name="style" value="old">旧方式</label>
    <label><input type="radio" name="style" value="new">新方式</label>
  </div>
  <label class="chk"><input type="checkbox" id="optWord">漢字併記</label>
  <label class="chk"><input type="checkbox" id="optKana">かな一致</label>
  <span class="sp"></span>
  <button id="bAnn">お知らせ (n)<i id="annCount" hidden></i></button>
  <button id="bMod" hidden>管理 (m)</button>
  <button id="bReq" hidden>申請<i id="reqCount" hidden></i></button>
  <button id="bHist">履歴 (u)</button>
  <button id="bImp">JSON読込</button>
  <button id="bExp">JSON書出</button>
  <button id="bPub" hidden>公開用JSON</button>
  <button id="bTerms">規約</button>
  <button id="bHelp">?</button>
  <span id="user" hidden></span>
  <button id="bLogin">Googleログイン</button>
  <input type="file" id="fileImp" accept=".json,application/json" hidden>
</header>
<div id="annBanner" hidden><span id="annText"></span><button id="annX" title="閉じる">✕</button></div>

<main>
  <section id="tool">
    <h2 class="t">入力 (i)</h2>
    <textarea id="src" spellcheck="false" placeholder="文章を入力すると、辞書にある語へアクセントを自動付与します。&#10;例: 男の子が箸で飴を食べた。"></textarea>
    <h2 class="t">結果 <span class="dim" id="outStat"></span></h2>
    <div id="out"></div>
  </section>

  <section id="dict">
    <h2 class="t">辞書 (j/k 移動 · a 追加 · e 編集 · d 削除 · / 検索)</h2>
    <input id="q" type="text" placeholder="/ 検索: 表記・読み・メモ" spellcheck="false">
    <div id="list"></div>
    <div id="detail"></div>
  </section>
</main>

<div id="status">
  <span id="mode">NORMAL</span>
  <input id="cmd" type="text" hidden placeholder=":q  :help  :rain" spellcheck="false">
  <span id="stMsg" class="dim"></span>
  <span class="sp"></span>
  <span id="stCount" class="dim"></span>
  <span id="stCloud" class="dim"></span>
</div>

<!-- 追加/編集モーダル -->
<div id="modal" class="ov" hidden>
  <form id="mform" class="box" autocomplete="off" onsubmit="return false">
    <h2 id="mtitle"></h2>
    <label>表記
      <input id="f_word" type="text" placeholder="男の子">
    </label>
    <label>アクセント入力 <span class="hint">下がり目に ／（/ でも可）。平板は記号なし。かなは自動でカタカナ化</span>
      <input id="f_input" type="text" placeholder="オトコ／ノコ" spellcheck="false">
    </label>
    <div id="f_prev"></div>
    <label>出典 <span class="hint">（申請・公開登録は必須）例: NHK日本語発音アクセント新辞典 2016 p.123</span>
      <input id="f_source" type="text">
    </label>
    <label>同音異義メモ
      <input id="f_homo" type="text" placeholder="一般（男児）">
    </label>
    <label>許容アクセント <span class="hint">カンマ区切り・同じ記法 例: オ／トコノコ, オトコノコ</span>
      <input id="f_allowed" type="text">
    </label>
    <label>旧アクセント履歴 <span class="hint">1行1件「年: 記法」例: 1943: オトコ／ノコ</span>
      <textarea id="f_hist" rows="3" spellcheck="false"></textarea>
    </label>
    <label>備考
      <input id="f_note" type="text">
    </label>
    <p class="dim" style="font-size:11px;margin:0">申請・公開登録したアクセントのデータは WTFPL（何をしてもよい）で公開されます。出典のない／他者の著作物の丸写しは不可。</p>
    <div class="btns">
      <span class="dim" id="mHint" style="margin-right:auto;font-size:12px"></span>
      <button type="button" id="b_cancel">キャンセル (Esc)</button>
      <button type="button" id="b_local">ローカル保存 (Ctrl+S)</button>
      <button type="button" id="b_primary" class="pri"></button>
    </div>
  </form>
</div>

<!-- 汎用パネル (申請一覧 / 履歴 / ヘルプ) -->
<div id="panel" class="ov" hidden>
  <div class="box">
    <h2 id="ptitle"></h2>
    <div id="pbody"></div>
    <div id="plist"></div>
    <div class="btns"><span class="dim" id="phint" style="margin-right:auto;font-size:12px"></span><button type="button" id="pClose">閉じる (Esc)</button></div>
  </div>
</div>

<div id="block" hidden></div>
<div id="toast"></div>

<script>
/* =====================================================================
   Firebase 設定 — README の手順で自分のプロジェクトの値に置き換えてください。
   (Web の apiKey は公開されても問題ありません。守るのは Firestore ルールです)
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCeeUPyk7DcAn6zaXvLQp8DcxaKs3qBqE0",
  authDomain: "japacsent.firebaseapp.com",
  projectId: "japacsent",
  appId: "1:315610612190:web:7c9a1ce9aa83e42f909d4f",
};
const FIREBASE_VERSION = "10.12.2";

/* file:// などで dictionary.json が読めない時のフォールバック */
const FALLBACK_SEED = [
  {id:"otokonoko",word:"男の子",reading:"オトコノコ",input_str:"オトコ／ノコ",source:"サンプル"},
  {id:"sakura",word:"桜",reading:"サクラ",input_str:"サクラ",source:"サンプル"}
];

/* ---------- ユーティリティ ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=(s,r=document)=>r.querySelector(s);
const lsGet=k=>{try{return localStorage.getItem(k)}catch{return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
const toKata=s=>s.replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60));
const toHira=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const SLASH_RE=/[\/\\＼¥￥]/g;
const SMALL="ァィゥェォャュョヮ";
const moras=s=>{const r=[];for(const ch of s){if(SMALL.includes(ch)&&r.length)r[r.length-1]+=ch;else r.push(ch)}return r};
const newId=()=>'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let toastTimer;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('on'),2200)}

/* ---------- アクセント記法のパース ---------- */
/* 「オトコ／ノコ」→ reading=オトコノコ, drop_position=3 / 「サクラ」→ flat */
function parseInput(raw){
  const s=toKata(String(raw||'').replace(SLASH_RE,'／').replace(/\s+/g,''));
  const parts=s.split('／');
  if(parts.length>2)return{error:'／ は1つだけ'};
  const reading=parts.join('');
  if(!reading)return{error:'読みを入力してください'};
  if(!/^[ァ-ヴー]+$/.test(reading))return{error:'カナ（と／）だけで入力してください'};
  if(parts.length===1)return{reading,accent_type:'flat',drop_position:0,input_str:reading};
  const all=moras(reading),head=moras(parts[0]),n=head.length;
  if(n===0)return{error:'／ の前に1音以上必要です'};
  if(head.join('')!==all.slice(0,n).join(''))return{error:'拗音の途中には置けません'};
  return{reading,accent_type:'drop',drop_position:n,input_str:s};
}
const insertSlash=(reading,n)=>{const m=moras(reading);return m.slice(0,n).join('')+'／'+m.slice(n).join('')};
const kindOf=e=>{if(e.accent_type!=='drop')return'平板';const n=moras(e.reading).length;return e.drop_position===1?'頭高':e.drop_position===n?'尾高':'中高'};

/* 辞書エントリの正規化 */
function norm(raw){
  if(!raw||typeof raw!=='object')return null;
  let src=raw.input_str;
  if(!src)src=(raw.accent_type==='drop'&&raw.drop_position>0)?insertSlash(toKata(raw.reading||''),raw.drop_position):(raw.reading||'');
  const p=parseInput(src);
  if(p.error||!String(raw.word||'').trim())return null;
  const fix=a=>(Array.isArray(a)?a:[]).map(x=>{const q=parseInput(x);return q.error?String(x):q.input_str});
  const hist={};
  if(raw.old_accent_history&&typeof raw.old_accent_history==='object')for(const[k,v]of Object.entries(raw.old_accent_history)){const q=parseInput(v);hist[k]=q.error?String(v):q.input_str}
  const word=String(raw.word).trim();
  return{
    id:String(raw.id||word+'|'+p.reading).replace(/\//g,'_'),
    word,reading:p.reading,accent_type:p.accent_type,drop_position:p.drop_position,input_str:p.input_str,
    allowed_accents:fix(raw.allowed_accents),
    homophones_note:String(raw.homophones_note||''),
    old_accent_history:hist,
    source:String(raw.source||''),
    note:String(raw.note||'')
  };
}
const toDoc=e=>({word:e.word,reading:e.reading,accent_type:e.accent_type,drop_position:e.drop_position,input_str:e.input_str,allowed_accents:e.allowed_accents,homophones_note:e.homophones_note,old_accent_history:e.old_accent_history,source:e.source,note:e.note});

/* ---------- アクセント描画 ---------- */
function accentHTML(e,style=state.style){
  const ms=moras(e.reading),d=e.drop_position,drop=e.accent_type==='drop';
  if(style==='new'){
    if(!drop)return esc(e.reading);
    return esc(ms.slice(0,d).join(''))+'<b class="dm">＼</b>'+esc(ms.slice(d).join(''));
  }
  const hi=new Set();
  if(!drop){for(let i=1;i<ms.length;i++)hi.add(i)}
  else if(d===1)hi.add(0);
  else for(let i=1;i<d;i++)hi.add(i);
  return'<span class="old">'+ms.map((m,i)=>`<span class="m${hi.has(i)?' h':''}${drop&&i===d-1?' d':''}">${esc(m)}</span>`).join('')+'</span>';
}
function accentFromStr(str,style){const p=parseInput(str);return p.error?`<span class="dim">${esc(str)}</span>`:accentHTML(p,style)}

/* ---------- IndexedDB (ローカル辞書 + 履歴) ---------- */
const DB={
  db:null,mem:{local:new Map(),history:[]},
  async open(){
    try{this.db=await new Promise((res,rej)=>{
      const r=indexedDB.open('accent-dict',1);
      r.onupgradeneeded=()=>{r.result.createObjectStore('local',{keyPath:'id'});r.result.createObjectStore('history',{keyPath:'n',autoIncrement:true})};
      r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
    })}catch{this.db=null}
  },
  req(store,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(store,mode);const r=fn(t.objectStore(store));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})},
  async all(s){if(!this.db)return s==='local'?[...this.mem.local.values()]:[...this.mem.history];return this.req(s,'readonly',o=>o.getAll())},
  async put(s,v){if(!this.db){if(s==='local')this.mem.local.set(v.id,v);else this.mem.history.push({...v,n:this.mem.history.length+1});return}return this.req(s,'readwrite',o=>o.put(v))},
  async del(s,k){if(!this.db){this.mem.local.delete(k);return}return this.req(s,'readwrite',o=>o.delete(k))}
};
const logHistory=(action,id,before,after)=>DB.put('history',{ts:Date.now(),action,id,before,after});

/* ---------- 状態 ---------- */
const state={
  style:lsGet('style')==='new'?'new':'old',
  showWord:lsGet('showWord')!=='0',
  kana:lsGet('kana')!=='0',
  q:'',selId:null,mode:'NORMAL'
};
let pub=[],cloud=[],local=[],base=[],merged=[],filtered=[],index=new Map(),maxLen=1;
const choice=new Map();
const FB={ready:false,user:null,isAdmin:false,requests:[],m:null,db:null,auth:null,unsubs:[]};
const role=()=>FB.isAdmin?'admin':FB.user?'user':'guest';

/* ---------- 辞書の統合とインデックス ---------- */
function rebuild(){
  const b=new Map();
  pub.forEach(e=>b.set(e.id,{...e,_layer:'public'}));
  cloud.forEach(e=>{if(e.deleted)b.delete(e.id);else b.set(e.id,{...e,_layer:'cloud'})});
  base=[...b.values()];
  const m=new Map(b);
  local.forEach(e=>m.set(e.id,{...e,_layer:'local'}));
  merged=[...m.values()].sort((a,b)=>toHira(a.reading).localeCompare(toHira(b.reading),'ja')||a.word.localeCompare(b.word,'ja'));
  index=new Map();maxLen=1;
  for(const e of merged){
    const keys=new Set();
    const kanjiWord=/[^ぁ-ゖァ-ヺー・\s]/.test(e.word);
    if(kanjiWord||state.kana)keys.add(toHira(e.word));
    if(state.kana)keys.add(toHira(e.reading));
    for(const k of keys){if(!k)continue;if(!index.has(k))index.set(k,[]);index.get(k).push(e);maxLen=Math.max(maxLen,k.length)}
  }
}
function refresh(){rebuild();renderOut();renderList();}

/* ---------- 自動付与 ---------- */
function renderOut(){
  const text=$('#src').value,n=toHira(text);let html='',i=0,hits=0;
  while(i<text.length){
    let hit=null;
    for(let L=Math.min(maxLen,text.length-i);L>=1;L--){const k=n.substr(i,L);const c=index.get(k);if(c){hit={L,k,c};break}}
    if(!hit){html+=esc(text[i]);i++;continue}
    const e=hit.c[(choice.get(hit.k)||0)%hit.c.length];
    const chunk=text.substr(i,hit.L);
    const cap=state.showWord&&toHira(e.word)!==toHira(e.reading)?`<small class="cap">${esc(chunk)}</small>`:'';
    const tip=`${e.word} [${kindOf(e)}${e.drop_position||''}]${hit.c.length>1?`  (${hit.c.length}候補: クリックで切替)`:''}${e.homophones_note?' / '+e.homophones_note:''}`;
    html+=`<span class="tok${hit.c.length>1?' multi':''}" data-k="${esc(hit.k)}" title="${esc(tip)}">${accentHTML(e)}${cap}</span>`;
    i+=hit.L;hits++;
  }
  $('#out').innerHTML=html;
  $('#outStat').textContent=text?`— ${hits} 語に付与`:'';
}

/* ---------- 一覧 ---------- */
function applyFilter(){
  const q=toHira(state.q.trim().toLowerCase());
  filtered=q?merged.filter(e=>toHira((e.word+' '+e.reading+' '+e.homophones_note+' '+e.note).toLowerCase()).includes(q)):merged;
  if(!filtered.some(e=>e.id===state.selId))state.selId=filtered[0]?.id??null;
}
function renderList(){
  applyFilter();
  const LIM=600,rows=filtered.slice(0,LIM).map(e=>
    `<div class="row${e.id===state.selId?' sel':''}" data-id="${esc(e.id)}"><span>${esc(e.word)}</span><span>${accentHTML(e)}</span><span class="k">${kindOf(e)}${e.drop_position||''}</span><span class="badge ${e._layer}">${e._layer}</span></div>`);
  $('#list').innerHTML=rows.join('')+(filtered.length>LIM?`<div class="row dim">… 他 ${filtered.length-LIM} 件（検索で絞り込み）</div>`:'')||'<div class="row dim">該当なし — a で追加</div>';
  $('#stCount').textContent=`${filtered.length}/${merged.length} 語`;
  const sel=$('#list .row.sel');if(sel)sel.scrollIntoView({block:'nearest'});
  renderDetail();
}
const selected=()=>merged.find(e=>e.id===state.selId)||null;
function renderDetail(){
  const e=selected(),d=$('#detail');
  if(!e){d.innerHTML='<span class="dim">単語が選択されていません</span>';return}
  const hist=Object.entries(e.old_accent_history).sort().map(([y,v])=>`<div><span class="yr">${esc(y)}</span>${accentFromStr(v,'old')}</div>`).join('');
  const allowed=e.allowed_accents.map(v=>accentFromStr(v,state.style)).join('、 ');
  d.innerHTML=`<div class="big">${esc(e.word)}　<span class="dim" style="font-size:13px">${esc(kindOf(e))}${e.drop_position?` [${e.drop_position}]`:' [0]'}</span></div>
  <div class="kv">
    <span>旧方式</span><span class="big">${accentHTML(e,'old')}</span>
    <span>新方式</span><span class="big">${accentHTML(e,'new')}</span>
    <span>入力記法</span><span class="mono">${esc(e.input_str)}</span>
    ${allowed?`<span>許容</span><span>${allowed}</span>`:''}
    ${e.homophones_note?`<span>同音異義</span><span>${esc(e.homophones_note)}</span>`:''}
    ${hist?`<span>旧アクセント</span><span>${hist}</span>`:''}
    <span>出典</span><span>${esc(e.source)||'<span class="dim">なし</span>'}</span>
    ${e.note?`<span>備考</span><span>${esc(e.note)}</span>`:''}
    <span>由来</span><span class="mono">${e._layer}</span>
  </div>`;
}
function move(delta){
  if(!filtered.length)return;
  let i=filtered.findIndex(e=>e.id===state.selId);
  i=Math.max(0,Math.min(filtered.length-1,(i<0?0:i)+delta));
  state.selId=filtered[i].id;renderList();
}
function selectIndex(i){if(!filtered.length)return;state.selId=filtered[i<0?filtered.length-1:0].id;renderList()}

function updatePreview(){
  const v=$('#f_input').value,box=$('#f_prev');
  if(!v){box.innerHTML='<span class="dim" style="font-size:13px">例: オトコ／ノコ（3音目の後に下がり目） / サクラ（平板）</span>';return}
  const p=parseInput(v);
  if(p.error){box.innerHTML=`<span class="err">${esc(p.error)}</span>`;return}
  box.innerHTML=`${accentHTML(p,'old')}　${accentHTML(p,'new')}<span class="meta">${kindOf(p)} · ${moras(p.reading).length}音 · drop=${p.drop_position}</span>`;
}
function fixInputField(ev){
  if(ev.isComposing)return;
  const el=ev.target,v=el.value,f=toKata(v.replace(SLASH_RE,'／'));
  if(f!==v){const s=el.selectionStart;el.value=f;try{el.setSelectionRange(s,s)}catch{}}
  updatePreview();
}
function collect(needSource){
  const word=$('#f_word').value.trim(),p=parseInput($('#f_input').value);
  const fail=m=>{toast(m);return null};
  if(!word)return fail('表記を入力してください');
  if(p.error)return fail('アクセント: '+p.error);
  const source=$('#f_source').value.trim();
  if(needSource&&!source)return fail('出典は必須です');
  const allowed=[];
  for(const s of $('#f_allowed').value.split(/[,、]/).map(x=>x.trim()).filter(Boolean)){const q=parseInput(s);if(q.error)return fail('許容アクセント: '+q.error);allowed.push(q.input_str)}
  const hist={};
  for(const line of $('#f_hist').value.split('\n').map(x=>x.trim()).filter(Boolean)){
    const m=line.match(/^(\d{3,4})\s*[:：]\s*(.+)$/);if(!m)return fail('履歴は「年: 記法」の形式で');
    const q=parseInput(m[2]);if(q.error)return fail(`履歴 ${m[1]}: ${q.error}`);hist[m[1]]=q.input_str;
  }
  return{word,input_str:p.input_str,source,homophones_note:$('#f_homo').value.trim(),allowed_accents:allowed,old_accent_history:hist,note:$('#f_note').value.trim()};
}
async function saveLocal(){
  const r=collect(false);if(!r)return;
  const id=modal.target?modal.target.id:newId();
  const e=norm({...r,id});if(!e)return toast('入力が不正です');
  const before=local.find(x=>x.id===id)||null;
  await DB.put('local',e);await logHistory(before?'edit':'add',id,before,e);
  local=await DB.all('local');closeModal();state.selId=id;refresh();toast('ローカルに保存しました');
}
async function primarySubmit(){
  const r=role();
  if(r==='guest')return saveLocal();
  const d=collect(true);if(!d)return;
  const id=modal.target?modal.target.id:newId();
  const e=norm({...d,id});if(!e)return toast('入力が不正です');
  try{
    if(r==='admin'){
      const{doc,setDoc,serverTimestamp}=FB.m;
      await setDoc(doc(FB.db,'entries',id),{...toDoc(e),updatedAt:serverTimestamp(),updatedBy:FB.user.uid});
      closeModal();state.selId=id;toast('公開辞書に登録しました');
    }else{
      const{doc,getDoc,collection,writeBatch,serverTimestamp}=FB.m;
      // 1分あたり3件まで。超えたらスパム扱い（段階的に制限）。ルール側にも同じ上限があります
      const rref=doc(FB.db,'rate',FB.user.uid),rs=await getDoc(rref),rd=rs.exists()?rs.data():null;
      const inWin=rd&&rd.windowStart&&Date.now()-rd.windowStart.toMillis()<60000,count=inWin?rd.count:0;
      if(count>=3){closeModal();await reportSpam();return}
      const b=writeBatch(FB.db);
      b.set(rref,inWin?{count:count+1,windowStart:rd.windowStart,lastWrite:serverTimestamp()}:{count:1,windowStart:serverTimestamp(),lastWrite:serverTimestamp()});
      b.set(doc(collection(FB.db,'requests')),{
        kind:modal.mode==='edit'?'edit':'add',targetId:modal.mode==='edit'?modal.target.id:'',
        entry:toDoc(e),source:e.source,note:e.note,
        uid:FB.user.uid,email:FB.user.email||'',name:FB.user.displayName||'',
        status:'pending',createdAt:serverTimestamp()
      });
      await b.commit();
      closeModal();toast('申請しました。承認をお待ちください');
    }
  }catch(err){console.error(err);toast('送信に失敗: '+(err.code||err.message))}
}

/* ---------- 削除 ---------- */
let confirmDel=null;
function askDelete(){
  const e=selected();if(!e)return;
  if(e._layer!=='local'&&role()!=='admin')return toast('公開辞書の削除は管理者のみです（e で自分用に上書き可）');
  confirmDel=e.id;setMode('CONFIRM',`「${e.word}」を削除しますか？ [y/N]`);
}
async function doDelete(){
  const e=merged.find(x=>x.id===confirmDel);confirmDel=null;idleMode();if(!e)return;
  try{
    if(e._layer==='local'){
      await DB.del('local',e.id);await logHistory('delete',e.id,e,null);local=await DB.all('local');
    }else{
      const{doc,deleteDoc,setDoc,serverTimestamp}=FB.m,ref=doc(FB.db,'entries',e.id);
      if(pub.some(p=>p.id===e.id))await setDoc(ref,{deleted:true,updatedAt:serverTimestamp(),updatedBy:FB.user.uid});
      else await deleteDoc(ref);
    }
    toast('削除しました');refresh();
  }catch(err){console.error(err);toast('削除に失敗: '+(err.code||err.message))}
}

async function approve(r){

  }catch(err){console.error(err);toast('承認に失敗: '+(err.code||err.message))}

async function reject(r){
  if(r.status!=='pending')return toast('処理済みです');

  try{const{doc,updateDoc,serverTimestamp}=FB.m;await updateDoc(doc(FB.db,'requests',r.id),{status:'rejected',reason,reviewedBy:FB.user.uid,reviewedAt:serverTimestamp()});toast('却下しました')}
  catch(err){toast('失敗: '+(err.code||err.message))}
}

function download(name,data){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);

const outEntry=e=>{const{_layer,...r}=e;return r};
async function importJSON(file){
  try{
    const arr=JSON.parse(await file.text());
    if(!Array.isArray(arr))throw new Error('配列ではありません');
    let ok=0,ng=0;
    for(const raw of arr){const e=norm(raw);if(!e){ng++;continue}
      const before=local.find(x=>x.id===e.id)||null;await DB.put('local',e);await logHistory('import',e.id,before,e);ok++}
    local=await DB.all('local');refresh();toast(`読込 ${ok}件${ng?` / 不正 ${ng}件`:''}`);
  }catch(err){toast('読込失敗: '+err.message)}
}

/* ---------- ブロック画面（タイムアウト / キック / BAN / IP BAN） ---------- */
const BLOCK_IMAGE_URL='';   // 自前の画像URLを使いたい場合はここに入れる（空なら内蔵SVG）
const BLOCK_META={
  timeout:{title:'タイムアウト中',color:'#e5c07b',label:'TIME OUT',msg:'連続操作（スパム）を検知しました。しばらくお待ちください。'},
  kick:{title:'キックされました',color:'#61afef',label:'KICK',msg:'セッションを終了しました。落ち着いてから再ログインしてください。'},
  ban:{title:'このアカウントはBANされました',color:'#e06c75',label:'BAN',msg:'このアカウントでは利用できません。'},
  ipban:{title:'このネットワークはBANされています',color:'#c678dd',label:'IP BAN',msg:'このIPアドレスからは利用できません。'}
};
function blockSVG(kind){
  const m=BLOCK_META[kind];
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320"><rect width="320" height="320" rx="24" fill="#14161a"/><circle cx="160" cy="140" r="96" fill="none" stroke="${m.color}" stroke-width="18"/><line x1="96" y1="76" x2="224" y2="204" stroke="${m.color}" stroke-width="18" stroke-linecap="round"/><text x="160" y="292" font-family="monospace" font-size="44" font-weight="700" text-anchor="middle" fill="${m.color}">${m.label}</text></svg>`;
  return'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
let blockTimer=null,blockKind=null,lastBlock=null,ipBlocked=false;
function unblock(){clearInterval(blockTimer);blockTimer=null;blockKind=null;lastBlock=null;$('#block').hidden=true;document.body.classList.remove('blocked')}
function showBlock(kind,d={},until=0){
  clearInterval(blockTimer);blockKind=kind;lastBlock={kind,d,until};
  const m=BLOCK_META[kind];
  const btn=kind==='timeout'||kind==='kick'?'':(FB.user?'<button id="blockOut">ログアウト</button>':'<button id="blockIn">ログインして確認</button>');
  $('#block').innerHTML=`<div class="blockbox"><img alt="${m.label}" src="${esc(BLOCK_IMAGE_URL||blockSVG(kind))}"><h2>${m.title}</h2><p>${m.msg}</p>${d.reason?`<p class="dim">理由: ${esc(d.reason)}</p>`:''}<p class="mono big" id="blockCd"></p>${btn}<p class="dim" style="font-size:12px">異議がある場合は管理者に連絡してください。</p></div>`;
  $('#block').hidden=false;document.body.classList.add('blocked');
  $('#blockOut')?.addEventListener('click',()=>FB.m.signOut(FB.auth));
  $('#blockIn')?.addEventListener('click',loginToggle);
  if(kind==='timeout'||kind==='kick'){
    const end=kind==='kick'?Date.now()+8000:until;
    const tick=()=>{const r=Math.max(0,end-Date.now());const s=Math.ceil(r/1000);$('#blockCd').textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;if(r<=0){unblock()}};
    tick();blockTimer=setInterval(tick,500);
  }
}
let firstBan=true,banSeenAt=0;
function applyBan(d,isNew){
  if(FB.isAdmin){unblock();return}
  if(!d){if(!ipBlocked&&(blockKind==='timeout'||blockKind==='ban'||blockKind==='ipban')){unblock();lsSet('japa_ban','0')}return}
  const at=d.at?.toMillis?.()||0;
  if(d.level==='ban'){lsSet('japa_ban','1');showBlock(d.ipbanned?'ipban':'ban',d);return}
  if(d.level==='timeout'){
    const until=(at||Date.now())+(d.seconds||0)*1000;
    if(until>Date.now())showBlock('timeout',d,until);else if(blockKind==='timeout')unblock();
    return;
  }
  if(d.level==='kick'&&isNew){showBlock('kick',d);FB.m.signOut(FB.auth)}
}

/* ---------- IP取得とログイン記録 ---------- */
async function getIP(){
  const f=async(url,parse)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),4000);try{const r=await fetch(url,{signal:c.signal,cache:'no-store'});return parse(await r.text())}finally{clearTimeout(t)}};
  try{const ip=await f('https://api.ipify.org?format=json',t=>JSON.parse(t).ip);if(ip)return ip}catch{}
  try{const ip=await f('https://www.cloudflare.com/cdn-cgi/trace',t=>(t.match(/^ip=(.+)$/m)||[])[1]);if(ip)return ip}catch{}
  return'';
}
async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function recordLogin(user){
  const{doc,getDoc,writeBatch,collection,serverTimestamp}=FB.m;
  const ip=await getIP();
  let h='',hit=false;
  try{h=ip?await sha256('japaccent:'+ip):''}catch{}
  if(h&&!FB.isAdmin){try{hit=(await getDoc(doc(FB.db,'bannedIps',h))).exists()}catch{}}
  if(hit){ipBlocked=true;lsSet('japa_ban','1');showBlock('ipban',{reason:'ログインを記録しました'});setTimeout(()=>FB.m.signOut(FB.auth),400)}
  else{ipBlocked=false;if(blockKind==='ipban')unblock()}
  const ua=navigator.userAgent.slice(0,300),email=user.email||'',name=user.displayName||'';
  try{
    const b=writeBatch(FB.db);
    b.set(doc(FB.db,'logins',user.uid),{uid:user.uid,email,name,lastIp:ip,lastIpHash:h,ipBanHit:hit,ua,lastAt:serverTimestamp()},{merge:true});
    b.set(doc(collection(FB.db,'loginLog')),{uid:user.uid,email,ip,ipHash:h,ipBanHit:hit,ua,at:serverTimestamp()});
    await b.commit();
  }catch(err){/* 30秒以内の再読込などはルールで拒否される。問題なし */}
}

  if(b.level==='ban')return'<span class="st-rejected">BAN</span>'+(b.ipbanPending?' <span class="st-pending">⚠IP BAN要承認(I)</span>':'');

function modRows(){

  return mod.logins.map(u=>{
    const hs=new Set(hu.get(u.uid)||[]);if(u.lastIpHash)hs.add(u.lastIpHash);
    const alts=new Set();hs.forEach(h=>(uh.get(h)||[]).forEach(x=>{if(x!==u.uid)alts.add(x)}));
    return{...u,hashes:[...hs],alts:[...alts],ban:mod.bans.get(u.uid)||null};

let lastG=0;
document.addEventListener('keydown',ev=>{
  const t=ev.target;
  // --- モーダル ---
  if(!$('#modal').hidden){
    if(ev.isComposing||ev.keyCode===229)return;
    if(ev.key==='Escape'){ev.preventDefault();return closeModal()}
    if(ev.key==='Enter'&&(ev.ctrlKey||ev.metaKey)){ev.preventDefault();return primarySubmit()}
    if((ev.key==='s'||ev.key==='S')&&(ev.ctrlKey||ev.metaKey)){ev.preventDefault();return role()==='guest'?saveLocal():(!$('#b_local').hidden&&saveLocal())}
    if(ev.key==='Enter'&&t.tagName==='INPUT'){
      ev.preventDefault();
      const i=FIELDS.indexOf(t.id);
      if(i>=0&&i<FIELDS.length-1)$('#'+FIELDS[i+1]).focus();else primarySubmit();
    }
    return;
  }
  // --- パネル ---
  if(panel.open){
    if(ev.key==='Escape'){ev.preventDefault();return closePanel()}
    if(t.matches('input,textarea')){if(ev.key==='Enter'&&(ev.ctrlKey||ev.metaKey)&&$('#a_post'))postAnnouncement();return}
    const items=panel.getItems();
    if(ev.key==='j'||ev.key==='ArrowDown'){panel.sel=Math.min(items.length-1,panel.sel+1);drawPanel();ev.preventDefault()}
    else if(ev.key==='k'||ev.key==='ArrowUp'){panel.sel=Math.max(0,panel.sel-1);drawPanel();ev.preventDefault()}
    else if(panel.keys[ev.key]&&items[panel.sel]){ev.preventDefault();panel.keys[ev.key](items[panel.sel])}
    return;
  }
  // --- 入力欄にフォーカス中 ---
  if(t.matches('input,textarea')){
    if(ev.isComposing||ev.keyCode===229)return;
    if(ev.key==='Escape'){t.blur();idleMode()}
    else if(t.id==='q'&&ev.key==='Enter'){t.blur();idleMode()}
    return;
  }
  if(ev.ctrlKey||ev.metaKey||ev.altKey)return;
  konamiBuf.push(ev.key.length===1?ev.key.toLowerCase():ev.key);konamiBuf=konamiBuf.slice(-10);
  if(konamiBuf.join()===KONAMI.join()){konamiBuf=[];ev.preventDefault();accentRain();return}
  // --- 削除確認 ---
  if(confirmDel){ev.preventDefault();if(ev.key==='y'||ev.key==='Y')doDelete();else{confirmDel=null;idleMode();toast('キャンセル')}return}
  // --- ノーマルモード ---
  switch(ev.key){
    case'j':case'ArrowDown':ev.preventDefault();move(1);break;
    case'k':case'ArrowUp':ev.preventDefault();move(-1);break;
    case'g':if(Date.now()-lastG<500){selectIndex(0)}lastG=Date.now();break;
    case'G':selectIndex(-1);break;
    case'a':{ev.preventDefault();const s=String(getSelection()).trim();openModal('add',null,s&&s.length<=30&&!s.includes('\n')?s:'');break}
    case'e':{ev.preventDefault();const e=selected();if(e)openModal('edit',e);break}
    case'd':ev.preventDefault();askDelete();break;
    case'/':ev.preventDefault();$('#q').focus();break;
    case'i':ev.preventDefault();$('#src').focus();break;
    case't':setStyle(state.style==='old'?'new':'old');break;
    case'r':openRequests();break;
    case'n':openAnnouncements();break;
    case'm':if(FB.isAdmin)openMod();break;
    case':':ev.preventDefault();openCmd();break;
    case'u':openHistory();break;
    case'?':openHelp();break;
    case'Escape':if(state.q){state.q='';$('#q').value='';renderList()}break;
  }
});
document.addEventListener('focusin',e=>{
  if(e.target.id==='q')setMode('SEARCH');
  else if(e.target.id==='cmd')setMode('COMMAND');
  else if(e.target.matches('input,textarea')&&$('#modal').hidden)setMode('INSERT');
});
document.addEventListener('focusout',()=>setTimeout(()=>{if(!document.activeElement?.matches('input,textarea'))idleMode()},0));

function setStyle(s){
  state.style=s;lsSet('style',s);
  document.querySelector(`input[name=style][value=${s}]`).checked=true;
  renderOut();renderList();
}
document.querySelectorAll('input[name=style]').forEach(r=>r.addEventListener('change',()=>setStyle(r.value)));
$('#optWord').addEventListener('change',e=>{state.showWord=e.target.checked;lsSet('showWord',e.target.checked?'1':'0');renderOut()});
$('#optKana').addEventListener('change',e=>{state.kana=e.target.checked;lsSet('kana',e.target.checked?'1':'0');refresh()});
let srcTimer;
$('#src').addEventListener('input',()=>{nullpoCheck($('#src').value);clearTimeout(srcTimer);srcTimer=setTimeout(()=>{lsSet('src',$('#src').value);renderOut()},120)});
$('#q').addEventListener('input',e=>{state.q=e.target.value;nullpoCheck(e.target.value);renderList()});
$('#out').addEventListener('click',e=>{
  const tok=e.target.closest('.tok');if(!tok)return;
  const k=tok.dataset.k;choice.set(k,(choice.get(k)||0)+1);renderOut();tokEgg(k);
});
$('#list').addEventListener('click',e=>{const r=e.target.closest('.row[data-id]');if(r){state.selId=r.dataset.id;renderList()}});
$('#list').addEventListener('dblclick',e=>{const r=e.target.closest('.row[data-id]');if(r){state.selId=r.dataset.id;const x=selected();if(x)openModal('edit',x)}});
$('#plist').addEventListener('click',e=>{const r=e.target.closest('.prow[data-i]');if(r){panel.sel=+r.dataset.i;drawPanel()}});
$('#f_input').addEventListener('input',fixInputField);
$('#f_input').addEventListener('compositionend',e=>fixInputField({target:e.target,isComposing:false}));
$('#b_cancel').addEventListener('click',closeModal);
$('#b_primary').addEventListener('click',primarySubmit);
$('#b_local').addEventListener('click',saveLocal);
$('#pClose').addEventListener('click',closePanel);
$('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});
$('#panel').addEventListener('mousedown',e=>{if(e.target.id==='panel')closePanel()});
$('#bHelp').addEventListener('click',openHelp);
$('#bTerms').addEventListener('click',openTerms);
$('#bAnn').addEventListener('click',openAnnouncements);
$('#bMod').addEventListener('click',openMod);
$('#annText').addEventListener('click',openAnnouncements);
$('#annX').addEventListener('click',()=>{if(anns[0])lsSet('annDismiss',anns[0].id);renderAnnBanner()});
$('#logo').addEventListener('click',logoEgg);
$('#cmd').addEventListener('keydown',ev=>{if(ev.isComposing)return;if(ev.key==='Enter'){ev.preventDefault();const v=$('#cmd').value;$('#cmd').blur();runCmd(v)}});
$('#cmd').addEventListener('blur',()=>{$('#cmd').hidden=true;idleMode()});
$('#bHist').addEventListener('click',openHistory);
$('#bReq').addEventListener('click',openRequests);
$('#bLogin').addEventListener('click',loginToggle);
$('#bImp').addEventListener('click',()=>$('#fileImp').click());
$('#fileImp').addEventListener('change',e=>{if(e.target.files[0])importJSON(e.target.files[0]);e.target.value=''});
$('#bExp').addEventListener('click',()=>{download('accent-dict-local.json',local.map(outEntry));toast(`ローカル辞書 ${local.length}件を書き出しました`)});
$('#bPub').addEventListener('click',()=>{
  const arr=base.map(outEntry);download('dictionary.json',arr);
  toast(`公開用 ${arr.length}件。リポジトリ直下の dictionary.json を置き換えてください`);
});
$('#user').addEventListener('click',()=>{
  if(!FB.user)return;
  navigator.clipboard?.writeText(FB.user.uid).then(()=>toast('UIDをコピーしました（管理者登録に使用）'),()=>toast('UID: '+FB.user.uid));
});

/* ---------- 起動 ---------- */
(async function boot(){
  $('#src').value=lsGet('src')??'男の子が箸で飴を食べた。';
  document.querySelector(`input[name=style][value=${state.style}]`).checked=true;
  $('#optWord').checked=state.showWord;$('#optKana').checked=state.kana;
  await DB.open();
  local=(await DB.all('local')).map(norm).filter(Boolean);
  try{
    const r=await fetch('dictionary.json',{cache:'no-cache'});
    if(!r.ok)throw new Error(r.status);
    pub=(await r.json()).map(norm).filter(Boolean);
  }catch{pub=FALLBACK_SEED.map(norm).filter(Boolean);toast('dictionary.json を読めないため最小サンプルで起動')}
  refresh();setMode('NORMAL');
  if(lsGet('japa_ban')==='1'&&typeof showBlock==='function')showBlock('ban',{reason:'このブラウザは以前BANされました'});
  initFirebase();
})();
</script>
</body>
